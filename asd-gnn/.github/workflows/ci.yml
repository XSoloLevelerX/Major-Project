name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts notebooks

      # The leakage suite runs first and on its own: if it is red, nothing else about
      # this commit is worth knowing. No one merges past this job.
      - name: Leakage suite
        run: pytest tests/test_no_leakage.py -v

      - name: Full test suite
        run: pytest tests/ -q

      # A green suite still does not prove the scripts wire together, so the whole
      # pipeline runs end to end on the synthetic cohort.
      - name: End-to-end smoke
        run: make smoke

      - name: Notebook builds and executes
        run: |
          python notebooks/build_results_notebook.py
          jupyter nbconvert --to notebook --execute --inplace notebooks/results.ipynb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            results/tables/
            results/figures/
            results/qc/
